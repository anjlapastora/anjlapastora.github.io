<!-- Shared watercolor orchid motifs, referenced via <use href="#id"> across templates -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="wc1" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="7" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"></feDisplacementMap>
      <feGaussianBlur stdDeviation="0.3"></feGaussianBlur>
    </filter>
    <filter id="ws1" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="11" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"></feDisplacementMap>
      <feGaussianBlur stdDeviation="4"></feGaussianBlur>
    </filter>
    <filter id="wcS1" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="2" seed="4" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"></feDisplacementMap>
      <feGaussianBlur stdDeviation="0.3"></feGaussianBlur>
    </filter>
    <!-- Gentler variant for small icon-sized renders (~100px). The other
         filters are tuned for 300-500px orchids; at icon scale their
         displacement/blur amounts are large relative to the shape and
         read as jagged, broken edges rather than a soft watercolor edge. -->
    <filter id="wcMini" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"></feDisplacementMap>
      <feGaussianBlur stdDeviation="0.15"></feGaussianBlur>
    </filter>
    <!-- Gentler variant for thin stroked lines (e.g. the "ovine" divider's
         connecting curve). A thin stroke is only 1-1.5px wide, so even
         wc1's moderate displacement pushes it further than its own width
         and breaks it into disconnected dashes; this keeps the wobble
         small enough that the line stays continuous. -->
    <filter id="wcLine" x="-10%" y="-40%" width="120%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="7" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"></feDisplacementMap>
      <feGaussianBlur stdDeviation="0.2"></feGaussianBlur>
    </filter>
