{% load static %}
{% load favicon_tags %}

<!DOCTYPE html>
<head>
    {% favicon_meta %}
    <title>{% block title %}Anj Lapastora{% endblock %}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'css/pygments.css' %}">
</head>

<body>

    {% include "includes/orchid_defs.html" %}

    <div class="page {% block page_class %}{% endblock %}">
        {% include "includes/header.html" %}

        <main>
            {% block content %}{% endblock %}
        </main>

        {% include "includes/footer.html" %}
    </div>

    <script src="{% static 'js/anj_lapastora.js' %}"></script>

</body>
</html>
