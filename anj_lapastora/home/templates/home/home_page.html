{% load static %}
{% load favicon_tags %}

<!DOCTYPE html>
<head>
  {% favicon_meta %}
  <title>{% block title %}Anj Lapastora{% endblock %}</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Cousine&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/instrument-serif" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<script>
window.addEventListener("load", () => {
  document.querySelectorAll(".fade-in").forEach(el => {
    el.classList.add("visible");
  });
});
</script>
<body>
<style>
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    overflow: hidden !important;
    background: #f3f3f3 !important;
}

.wrapper {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    margin: 0 !important;
    padding: 0 !important;
    text-align: center;
    width: 100%;
    max-width: 600px;
    z-index: 9999;
}

.title {
  color: #A74d4a;
  font-family: 'Instrument Serif', serif;
  letter-spacing: -.03em;
  font-size: clamp(50px, 12vw, 110px);
  font-weight: 400;
  margin-bottom: 40px;
  line-height: 1;
}

.nav {
  display: flex !important;
  flex-direction: column !important;
  gap: 45px !important; 
  align-items: center !important;
  justify-content: center !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
}

.nav a {
  margin: 0 !important; 
  padding: 0 0 15px 0 !important; 
  width: 250px;
  text-decoration: none !important;
  text-align: center !important;
  border-bottom: 1px solid rgba(167, 77, 74, 0.3);  
}

.nav a:hover {
    border-bottom: 1px solid rgba(167, 77, 74, 1);
    transition: border-color 0.3s ease;
}

@media (max-width: 600px) {
    .nav a {
        width: 150px;
    }
}
</style>

  <main class="wrapper fade-in">
    <h1 class="title fade-in" style="transition-delay: 0ms;">Anj Lapastora</h1>
    <br>
    <nav class="nav fade-in" style="transition-delay: 0.6s;">
      <a href="/about">About</a>
      <a href="/tech">Tech</a>
      <a href="/atelier">Atelier</a>
      <a href="/musings">Musings</a>
    </nav>

  </main>

</body>
</html>
